<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Driver (test)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; margin: 0; }
  #map { height: 100vh; width: 100%; }

  #status {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-size: 13.5px;
    font-weight: 600;
    color: #333;
    max-width: 90vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #9aa0a8;
    flex-shrink: 0;
  }
  #status.live .dot {
    background: #0a7d2c;
    box-shadow: 0 0 0 0 rgba(10,125,44,0.5);
    animation: pulse 1.6s infinite;
  }
  #status.live { color: #145c26; }
  #status.ended .dot { background: #b00020; }
  #status.ended { color: #b00020; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(10,125,44,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(10,125,44,0); }
    100% { box-shadow: 0 0 0 0 rgba(10,125,44,0); }
  }

  .car-marker-icon, .dest-marker-icon {
    font-size: 26px;
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  /* Rotated separately from the marker's own (Leaflet-managed) positioning transform,
     so our rotation never clobbers the translate3d() Leaflet uses to place the icon. */
  .car-rotate {
    display: inline-block;
    transition: transform 0.25s linear;
  }
</style>
</head>
<body>
  <div id="status"><span class="dot"></span><span id="statusText">Connecting...</span></div>
  <div id="map"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const backendUrl = (params.get("backend") || "https://car-recovery-backend.onrender.com").replace(/\/$/, "");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");

    function setStatus(text, cls) {
      statusText.textContent = text;
      statusEl.className = cls || "";
    }

    if (!token) {
      setStatus("No token provided. Open this page as track.html?token=...", "ended");
    } else {
      const map = L.map("map").setView([0, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let marker = null;
      let destMarker = null;
      let hasCentered = false;
      let routeLine = null;

      const carIcon = L.divIcon({
        html: '<span class="car-rotate">🚗</span>',
        className: "car-marker-icon",
        iconSize: [26, 26],
        iconAnchor: [13, 13],
      });

      // The 🚗 emoji faces left (west) by default in most platforms' emoji fonts, not "up" -
      // this is the correction applied before rotating to the actual direction of travel.
      // If it looks off on your device/font, this is the number to tweak.
      const CAR_ICON_FACES_DEG = 270;

      let lastCarPos = null; // [lat, lng] of the previous location push, for bearing calc
      let carRotation = 0; // unwrapped (not mod 360) so the CSS transition always takes the short way round

      function bearingDeg(from, to) {
        const toRad = (d) => (d * Math.PI) / 180;
        const toDeg = (r) => (r * 180) / Math.PI;
        const lat1 = toRad(from[0]), lat2 = toRad(to[0]);
        const dLng = toRad(to[1] - from[1]);
        const y = Math.sin(dLng) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function rotateCarIcon(targetDeg) {
        if (!marker) return;
        const el = marker.getElement();
        const inner = el && el.querySelector(".car-rotate");
        if (!inner) return;
        // Shortest angular step from the current (unwrapped) rotation to the target, so the
        // icon never spins the long way round when crossing the 0/360 boundary.
        let diff = (targetDeg - (carRotation % 360)) % 360;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        carRotation += diff;
        inner.style.transform = `rotate(${carRotation}deg)`;
      }
      const destIcon = L.divIcon({
        html: "📍",
        className: "dest-marker-icon",
        iconSize: [26, 26],
        iconAnchor: [13, 26], // pin's point should land on the actual location
      });

      // Grab the customer's own location once, to give the backend a destination to
      // compute ETA against. Best-effort: if permission is denied or unavailable, ETA
      // just never shows up in the location pushes below - same graceful degradation
      // the backend already applies when OSRM itself is unreachable. enableHighAccuracy
      // matters here - without it, desktop browsers often fall back to coarse WiFi/IP-based
      // positioning that can be off by kilometers.
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const destPos = [pos.coords.latitude, pos.coords.longitude];
            destMarker = L.marker(destPos, { icon: destIcon }).addTo(map);
            fetch(`${backendUrl}/api/track/${token}/destination`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            }).catch(() => {});
          },
          () => {},
          { enableHighAccuracy: true, timeout: 10000 },
        );
      }

      const backendHost = new URL(backendUrl).host;
      const wsProto = new URL(backendUrl).protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${wsProto}://${backendHost}/ws/track/${token}`);

      socket.addEventListener("open", () => {
        setStatus("Connected. Waiting for driver location...", "live");
      });

      socket.addEventListener("message", (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "location") {
          const etaText = typeof msg.eta_minutes === "number" ? ` · ETA ${Math.round(msg.eta_minutes)} min` : "";
          setStatus(`Live — last update ${new Date().toLocaleTimeString()}${etaText}`, "live");
          const pos = [msg.lat, msg.lng];
          if (!marker) {
            marker = L.marker(pos, { icon: carIcon }).addTo(map);
          } else {
            if (typeof msg.heading === "number") {
              // Driver client sent a real heading (GPS course or compass) - trust it
              // directly, it's more accurate than anything we can derive here, and it
              // works even when the driver is stationary (a two-point bearing can't).
              rotateCarIcon((msg.heading - CAR_ICON_FACES_DEG + 360) % 360);
            } else if (lastCarPos && map.distance(lastCarPos, pos) > 3) {
              // Fallback: no heading provided, estimate it from the last two fixes.
              // Only recompute once the driver has actually moved a meaningful distance -
              // GPS noise while stationary would otherwise spin the icon randomly.
              rotateCarIcon((bearingDeg(lastCarPos, pos) - CAR_ICON_FACES_DEG + 360) % 360);
            }
            marker.setLatLng(pos);
          }
          lastCarPos = pos;
          if (Array.isArray(msg.route) && msg.route.length > 0) {
            if (!routeLine) {
              routeLine = L.polyline(msg.route, { color: "#1a73e8", weight: 4, opacity: 0.7 }).addTo(map);
            } else {
              routeLine.setLatLngs(msg.route);
            }
          }
          if (!hasCentered) {
            if (destMarker) {
              // Frame both markers - a fixed close zoom on just the driver would leave
              // the destination pin outside the visible viewport whenever it's more than
              // a block or two away.
              map.fitBounds(L.latLngBounds([pos, destMarker.getLatLng()]), { padding: [40, 40] });
            } else {
              map.setView(pos, 15);
            }
            hasCentered = true;
          }
        } else if (msg.type === "session_ended") {
          setStatus("This link is no longer active — the driver stopped sharing.", "ended");
        }
      });

      socket.addEventListener("close", () => {
        if (statusEl.className !== "ended") {
          setStatus("Connection closed.", "ended");
        }
      });

      socket.addEventListener("error", () => {
        setStatus("This link is no longer active or could not be reached.", "ended");
      });
    }
  </script>
</body>
</html>
